name: CI

on:
  push:
    branches: [main, feature/*]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12

      - name: Install dependencies
        run: bun install --no-save

      - name: Lint (advisory)
        continue-on-error: true
        run: bun run lint

      - name: Test (advisory)
        continue-on-error: true
        run: bun test

      - name: Build
        run: bun run build
